<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#09090b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='192' height='192' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 2a10 10 0 1 0 10 10H12V2z'/></svg>">
    <link rel="manifest" id="manifest-link" href="manifest.json">
    <title>Mobile Agent Remote</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@catppuccin/highlightjs@0.1.4/css/catppuccin-mocha.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        :root {
            /* Catppuccin Mocha Palette */
            --ctp-rosewater: #f5e0dc;
            --ctp-flamingo: #f2cdcd;
            --ctp-pink: #f5c2e7;
            --ctp-mauve: #cba6f7;
            --ctp-red: #f38ba8;
            --ctp-maroon: #eba0ac;
            --ctp-peach: #fab387;
            --ctp-yellow: #f9e2af;
            --ctp-green: #a6e3a1;
            --ctp-teal: #94e2d5;
            --ctp-sky: #89dceb;
            --ctp-sapphire: #74c7ec;
            --ctp-blue: #89b4fa;
            --ctp-lavender: #b4befe;
            --ctp-text: #cdd6f4;
            --ctp-subtext1: #bac2de;
            --ctp-subtext0: #a6adc8;
            --ctp-overlay2: #9399b2;
            --ctp-overlay1: #7f849c;
            --ctp-overlay0: #6c7086;
            --ctp-surface2: #585b70;
            --ctp-surface1: #45475a;
            --ctp-surface0: #313244;
            --ctp-base: #1e1e2e;
            --ctp-mantle: #181825;
            --ctp-crust: #11111b;

            --bg-color: var(--ctp-base);
            --bg-light: var(--ctp-surface0);
            --bg-hover: var(--ctp-surface1);
            --text-main: var(--ctp-text);
            --text-muted: var(--ctp-subtext0);
            --accent: var(--ctp-mauve);
            --accent-glow: rgba(203, 166, 247, 0.4);
            
            /* Neumorphic Shadows for Base (#1e1e2e) */
            --shadow-outset: 4px 4px 10px #13131d, -4px -4px 10px #29293f;
            --shadow-inset: inset 3px 3px 6px #13131d, inset -3px -3px 6px #29293f;
            --shadow-button: 2px 2px 5px #13131d, -2px -2px 5px #29293f;
            --shadow-button-active: inset 2px 2px 5px #13131d, inset -2px -2px 5px #29293f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header - Glassmorphic */
        header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 30, 46, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(17, 17, 27, 0.4);
            z-index: 10;
        }

        .header-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .status {
            font-size: 0.75rem;
            color: #10b981;
            font-weight: 500;
        }
        .status.disconnected { color: #ef4444; }

        .select-wrapper {
            position: relative;
            display: inline-block;
        }

        .select-wrapper select {
            background-color: var(--bg-light);
            color: var(--text-main);
            border: 1px solid #27272a;
            padding: 6px 28px 6px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            outline: none;
            appearance: none;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.3);
            transition: border-color 0.2s;
            max-width: 140px;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
        }

        .select-wrapper select:hover {
            border-color: #3f3f46;
        }

        .select-wrapper::after {
            content: "▼";
            font-size: 0.6rem;
            color: var(--text-muted);
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        /* Chat Container */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 88%;
            padding: 14px 18px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease;
            word-wrap: break-word;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--bg-color);
            color: var(--text-main);
            border-bottom-right-radius: 4px;
            box-shadow: var(--shadow-outset);
            border: 1px solid var(--ctp-surface0);
        }

        .message.agent {
            align-self: flex-start;
            background-color: var(--bg-color);
            color: var(--text-muted);
            border-bottom-left-radius: 4px;
            box-shadow: var(--shadow-inset);
            border: 1px solid var(--ctp-crust);
        }

        /* Markdown Styles */
        .message.agent p {
            margin-bottom: 12px;
        }
        .message.agent p:last-child {
            margin-bottom: 0;
        }
        .message.agent pre {
            background-color: var(--bg-light);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 12px 0;
            border: 1px solid #27272a;
        }
        .message.agent code {
            font-family: monospace;
            background-color: var(--bg-light);
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 0.85em;
        }
        .message.agent pre code {
            background-color: transparent;
            padding: 0;
            font-size: 0.85rem;
        }
        .message.agent ul, .message.agent ol {
            margin: 12px 0;
            padding-left: 24px;
        }
        .message.agent li {
            margin-bottom: 4px;
        }
        .message.agent strong {
            color: var(--text-main);
            font-weight: 600;
        }

        /* Train of Thought */
        .thought-process {
            background-color: var(--ctp-crust);
            border: 1px solid var(--ctp-surface0);
            border-radius: 8px;
            margin: 12px 0;
            padding: 10px 14px;
            font-size: 0.85rem;
            color: var(--ctp-overlay1);
            transition: all 0.2s ease;
        }

        .thought-process summary {
            cursor: pointer;
            font-weight: 500;
            user-select: none;
            color: var(--ctp-subtext1);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .thought-process summary svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }
        
        .thought-process summary:hover {
            color: var(--ctp-text);
        }

        .thought-process .content {
            margin-top: 10px;
            white-space: pre-wrap;
            opacity: 0.8;
            border-top: 1px solid var(--ctp-surface0);
            padding-top: 10px;
            line-height: 1.6;
        }

        /* Tool Execution Pill */
        .tool-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: var(--ctp-surface0);
            border: 1px solid var(--ctp-surface1);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin: 8px 0;
            box-shadow: var(--shadow-outset);
            color: var(--ctp-text);
        }
        
        .tool-pill svg {
            width: 14px;
            height: 14px;
            stroke: var(--ctp-green);
        }
        
        .tool-pill .arg {
            color: var(--ctp-subtext0);
            max-width: 150px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Code Block Header */
        .code-block {
            margin: 12px 0;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--ctp-surface0);
            box-shadow: var(--shadow-outset);
        }
        
        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--ctp-surface0);
            padding: 6px 12px;
            font-size: 0.75rem;
            color: var(--ctp-subtext1);
            font-family: monospace;
        }
        
        .code-header button {
            background: none;
            border: none;
            color: var(--ctp-text);
            cursor: pointer;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: color 0.2s;
        }
        
        .code-header button:hover {
            color: var(--ctp-green);
        }
        
        .message.agent .code-block pre {
            margin: 0;
            border: none;
            border-radius: 0;
            box-shadow: none;
            background-color: var(--ctp-crust);
        }

        .message.system {
            align-self: center;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.8rem;
            box-shadow: none;
        }

        /* Input Area - Glassmorphic */
        .input-area {
            padding: 16px 20px 24px 20px;
            display: flex;
            gap: 16px;
            align-items: center;
            background: rgba(30, 30, 46, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 -4px 20px rgba(17, 17, 27, 0.4);
            z-index: 10;
        }

        #msg-input {
            flex: 1;
            background-color: var(--bg-color);
            color: var(--text-main);
            border: none;
            padding: 14px 20px;
            border-radius: 24px;
            font-size: 1rem;
            outline: none;
            box-shadow: var(--shadow-inset);
            transition: box-shadow 0.2s ease;
        }

        #msg-input:focus {
            box-shadow: var(--shadow-inset), 0 0 0 1px var(--accent-glow);
        }

        #send-btn {
            background-color: var(--bg-color);
            color: var(--accent);
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-button);
            transition: all 0.2s ease;
        }

        #send-btn:active {
            box-shadow: var(--shadow-button-active);
            color: var(--text-main);
        }

        #send-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            margin-left: 2px;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: none;
            padding: 14px 18px;
            background-color: var(--bg-color);
            border-radius: 16px;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            box-shadow: var(--shadow-inset);
            align-items: center;
            gap: 6px;
        }
        .typing-indicator.visible { display: flex; }

        .dot {
            width: 6px;
            height: 6px;
            background-color: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Action Modal */
        #action-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        #action-modal.visible {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: var(--bg-color);
            padding: 24px;
            border-radius: 16px;
            width: 85%;
            max-width: 350px;
            box-shadow: var(--shadow-outset);
            text-align: center;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .modal-command {
            background: var(--bg-light);
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.85rem;
            color: #fbbf24;
            margin-bottom: 20px;
            word-wrap: break-word;
            box-shadow: var(--shadow-inset);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: space-between;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            box-shadow: var(--shadow-button);
            background: var(--bg-color);
            color: var(--text-main);
            transition: box-shadow 0.2s;
        }

        .modal-btn:active { box-shadow: var(--shadow-button-active); }
        .modal-btn.approve { color: #10b981; }
        .modal-btn.deny { color: #ef4444; }

        /* Voice Input Animations */
        @keyframes pulse-record {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); color: var(--text-muted); }
            50% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); color: #ef4444; }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); color: var(--text-muted); }
        }
        #mic-btn.recording {
            animation: pulse-record 1.5s infinite;
            color: #ef4444;
        }
        #tts-btn.active {
            color: #10b981; /* Green when TTS is enabled */
        }

        /* Settings Form */
        .settings-group {
            text-align: left;
            margin-bottom: 16px;
        }

        .settings-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .settings-input {
            width: 100%;
            background: var(--bg-light);
            color: var(--text-main);
            border: 1px solid #27272a;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            box-shadow: var(--shadow-inset);
        }

        .settings-input:focus {
            border-color: var(--accent);
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s, background 0.2s;
            flex-shrink: 0;
        }
        
        .icon-btn:hover {
            color: var(--text-main);
            background: var(--bg-hover);
        }

    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <div style="display: flex; align-items: center; gap: 8px;">
                <h1>VS Code Agent</h1>
                <button class="icon-btn" id="btn-install" aria-label="Install App" style="display: none;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                </button>
                <button class="icon-btn" id="tts-btn" aria-label="Toggle Read Aloud">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
                </button>
                <button class="icon-btn" id="btn-clear" aria-label="Clear Chat">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>
                <button class="icon-btn" id="btn-settings" aria-label="Settings">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </button>
            </div>
            <div class="status" id="status-indicator">Connecting...</div>
        <div class="header-right" style="display: flex; gap: 4px; min-width: 0;">
            <div class="select-wrapper" id="model-wrapper" style="display: none; min-width: 0;">
                <select id="model-select" style="max-width: 100px;"></select>
            </div>
            <div class="select-wrapper" id="session-wrapper" style="display: none; min-width: 0;">
                <select id="session-select" style="max-width: 90px;"></select>
            </div>
        </div>
    </header>

    <div id="chat-container">
        <div class="message system">Connected to your workspace.</div>
        <div class="typing-indicator" id="typing-indicator">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
    </div>

    <div class="input-area">
        <button id="mic-btn" class="icon-btn" aria-label="Voice Input">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
        </button>
        <input type="text" id="msg-input" placeholder="Message agent..." autocomplete="off">
        <button id="send-btn" aria-label="Send">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
        </button>
    </div>

    <!-- Action Modal -->
    <div id="action-modal">
        <div class="modal-content">
            <div class="modal-title">Approve Command?</div>
            <div class="modal-command" id="modal-command-text">npm install</div>
            <div class="modal-actions">
                <button class="modal-btn deny" id="btn-deny">Deny</button>
                <button class="modal-btn approve" id="btn-approve">Approve</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 100; align-items: center; justify-content: center;">
        <div class="modal-content">
            <div class="modal-title">API Settings</div>
            
            <div class="settings-group">
                <label for="provider-select">AI Provider</label>
                <select id="provider-select" class="settings-input">
                    <option value="openrouter">OpenRouter</option>
                    <option value="openai">OpenAI</option>
                    <option value="anthropic">Anthropic</option>
                    <option value="gemini">Google Gemini</option>
                </select>
            </div>
            
            <div class="settings-group">
                <label for="apikey-input">API Key</label>
                <input type="password" id="apikey-input" class="settings-input" placeholder="sk-..." autocomplete="off">
            </div>

            <div class="modal-actions" style="margin-top: 24px;">
                <button class="modal-btn deny" id="btn-cancel-settings">Cancel</button>
                <button class="modal-btn approve" id="btn-save-settings">Save Config</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => {
                    console.log('SW registration failed: ', err);
                });
            });
        }
    </script>
</body>
</html>
